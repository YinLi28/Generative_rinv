platform:
  data_parquet_dir: /group-data/svj/EveNet_generative/EveNet_rinv_test/parquet_train
  data_parquet_val_dir: /group-data/svj/EveNet_generative/EveNet_rinv_test/parquet_val
  number_of_workers: 1
  resources_per_worker:
    CPU: 4
    GPU: 1
  batch_size: 256
  prefetch_batches: 1
  use_gpu: true

logger:
  wandb:
    project: "EveNet-rinv"
    run_name: &logger_name "EveNet_rinv_test_zmass1500_0p5_doc18x7"
    tags: ["EveNet", "SVJ", "rinv", "TruthGeneration", "doc18x7", "zmass1500_0p5"]
    simplified: true
  local:
    save_dir: /home/lyin/evenet_rinv/experiments/EveNet_rinv_test/logs
    name: *logger_name
    version: "v1"

options:
  default: /home/lyin/evenet_rinv/repos/EveNet-Full/share/options/options.yaml
  Training:
    total_epochs: 200
    epochs: 200
    model_checkpoint_save_path: /home/lyin/evenet_rinv/experiments/EveNet_rinv_test/checkpoints
    model_checkpoint_load_path: null
    pretrain_model_load_path: /home/lyin/evenet_rinv/checkpoints/checkpoints.20M.a4.last.ckpt
    learning_rate: 0.00001
    weight_decay: 0.001
    diffusion_every_n_epochs: 20
    eval_metrics_every_n_epochs: 1
    apply_event_weight: false
    Components:
      GlobalEmbedding:
        optimizer_group: "encoder"
        optimizer_type: "Adamw"
        learning_rate: 0.00001
      PET:
        optimizer_group: "encoder"
        optimizer_type: "Adamw"
        learning_rate: 0.00001
      ObjectEncoder:
        optimizer_group: null
      Classification:
        include: false
      Regression:
        include: false
      Assignment:
        include: false
      Segmentation:
        include: false
      GlobalGeneration:
        include: false
      ReconGeneration:
        include: false
      TruthGeneration:
        include: true
        optimizer_group: "head"
        optimizer_type: "Adamw"
        learning_rate: 0.0001
        loss_scale: 1.0
        diffusion_steps: 300
    ProgressiveTraining:
      stages:
        - name: "truth_generation"
          epoch_ratio: 1.0
          transition_ratio: 0.0
          loss_weights:
            generation-truth: [1.0, 1.0]
            generation-recon: [0.0, 0.0]
            classification: [0.0, 0.0]
            classification-noised: [0.0, 0.0]
            regression: [0.0, 0.0]
            assignment: [0.0, 0.0]
            segmentation: [0.0, 0.0]
          train_parameters:
            noise_prob: [1.0, 1.0]
            reco_attn_mask: [0.0, 0.0]
            ema_decay: [0.999, 0.999]
    EarlyStopping:
      patience: 50
      min_delta: 0.0
      monitor: "val/loss"
      mode: "min"
      verbose: true
    EMA:
      enable: true
      decay: 0.999
      start_epoch: 0
      update_step: 1
      replace_model_after_load: true
      replace_model_at_end: false
  Dataset:
    dataset_limit: 1.0
    normalization_file: /group-data/svj/EveNet_generative/EveNet_rinv_test/parquet/normalization.pt
    val_split: [0.0, 1.0]

network:
  default: /home/lyin/evenet_rinv/repos/EveNet-Full/share/network/network-20M.yaml
  Body:
    PET:
      feature_drop: 0.0
      local_point_index: [2, 3]
  TruthGeneration:
    feature_drop: 0.0
    neutrino_position_encode: false
    max_position_length: 8

event_info:
  default: event_info_rinv_generation.yaml

resonance:
  default: /home/lyin/evenet_rinv/repos/EveNet-Full/share/resonance/standard_model.yaml
